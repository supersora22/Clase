<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WEB Jose - Carrusel Completo</title>
    <meta name="author" content="Jose">
    <style>
@keyframes flujoColor {
    0%   { background-color: #121212; } /* Slide 1 */
    15%  { background-color: #1a1a2e; } /* Slide 2 */
    30%  { background-color: #16213e; } /* Slide 3 */
    45%  { background-color: #0f3460; } /* Slide 4 */
    60%  { background-color: #1b1b1b; } /* Slide 5 */
    75%  { background-color: #2c3e50; } /* Slide 6 */
    90%  { background-color: #243447; } /* Slide 7 */
    100% { background-color: #050505; } /* Slide 8 */
}
body {
    margin: 0;
    min-height: 100vh;
    animation: flujoColor linear both;
    animation-timeline: --carouselTimeline;
    timeline-scope: --carouselTimeline; 
    transition: background-color 1s ease;
}
   #menuhorizontal {
    width: fit-content; 
    margin: 0 auto 20px auto; 
    padding: 5px 5px 10px 10px;
    display: flex;
    justify-content: center;
    gap: 10px;
}
        #menuhorizontal a {
            font-size: 20px;
            padding: 5px 15px;
            text-decoration: none;
            color: black;
            background: #DEA740;
            border-radius: 5px 10px 5px 10px;
        }
        #menuhorizontal a:hover {
            color: rgb(7, 101, 163);
            background: #b87511;
            border-bottom: 3px solid rgb(212, 129, 34);
            border-top: 3px solid rgb(212, 129, 34);
        }
.carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scroll-timeline: --carouselTimeline x;
    anchor-name: --carousel;
    width: 800px;
    height: 400px;
    margin: 50px auto;
    border: 2px solid #333;
    border-radius: 15px;
    position: relative;
    z-index: 10;
}
        .carousel__slide {
            flex: 0 0 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .carousel__slide img {
            width: 100%;
            height: 100%;
        }
        .carousel--scroll-buttons {
            &::scroll-button(inline-start) {
                content: 'Anterior';
                font-size: 16px;
                background: #DEA740;
                color: black;
                padding: 10px 15px;
                border-radius: 20px;
                cursor: pointer;
                position: fixed;
                position-anchor: --carousel;
                position-area: inline-start center;
            }
            &::scroll-button(inline-end) {
                content: 'Siguiente';
                font-size: 16px;
                background: #DEA740;
                color: black;
                padding: 10px 15px;
                border-radius: 20px;
                cursor: pointer;
                position: fixed;
                position-anchor: --carousel;
                position-area: inline-end center;
            }
        }
    </style>
</head>
<body>
